[project]
name = "ai-rollout-tracker"
version = "0.1.0"
description = "Quantitative, neutral tracking of the global AI rollout"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "pyarrow>=17",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "cryptography>=43",
    "scipy>=1.13",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_data: reads the real observation table (shared base + track view)"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_tracker.site" = ["static/*"]
"ai_tracker.site_bundle" = ["schema/*.json"]
