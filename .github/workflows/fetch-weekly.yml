# Weekly data fetch (Mondays). Refreshes every catalog series into the Actions cache and runs the warehouse checks.
# Nothing is committed. The only data artifact is the encrypted snapshot (data-snapshot, AES-256-GCM with the DATA_KEY
# secret, 14 days): artifacts of a public repo are downloadable and several licences forbid republishing, so data never
# leaves the job unencrypted. Without the DATA_KEY secret the snapshot steps are skipped. docs/drift.md, "Datasnapshot".
# Scheduled runs only happen on the default branch (main); run by hand with workflow_dispatch.
# A failed check fails the job before the cache is saved, so a bad table never replaces the cached one.
# A stale series (freshness check, exit 2) saves the cache first and then fails the job.
# Shares the concurrency group and cache key prefix with the other data jobs (nowcast.yml, collect-weekly.yml).
# Developer adoption (track B1): npm and pypistats are ordinary catalog series (no secret). The PyPI BigQuery job
# (keyless OIDC, shared 1 TB/month sandbox quota) only runs when dispatched with input pypi_bigquery, e.g. once
# with "backfill" to put the history into the cache (docs/kallor/utvecklaradoption.md). It never fails the run.
name: Weekly data fetch

on:
  schedule:
    - cron: "37 3 * * 1"  # Mondays 03:37 UTC
  workflow_dispatch:
    inputs:
      pypi_bigquery:
        description: "PyPI BigQuery job before the fetch (shared quota): none, backfill (one-off history) or incremental"
        type: choice
        default: none
        options: [none, backfill, incremental]

permissions:
  contents: read
  id-token: write  # keyless GCP auth for the optional PyPI BigQuery job

concurrency:
  group: ai-data  # never two jobs writing the data cache at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a cold cache refetches every SEC filing (rate limited) and the EIA back issues
    env:
      PYTHONPATH: src
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}  # Cloudflare Radar (Radar: Read only), track B3
    steps:
      - uses: actions/checkout@v4
      - name: Require SEC_USER_AGENT (no fallback for sec.gov)
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::Repository secret SEC_USER_AGENT is missing. sec.gov requires a declared User-Agent with a contact address, e.g. 'ai-rollout-tracker <contact address>'. See docs/drift.md."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
          restore-keys: ai-data-
      - name: GCP auth for the PyPI BigQuery job (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.pypi_bigquery != 'none'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.pypi_bigquery != 'none'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      - name: PyPI BigQuery job into data/raw/pypi_bq (optional, dry-run first, byte cap)
        if: github.event_name == 'workflow_dispatch' && inputs.pypi_bigquery != 'none'
        continue-on-error: true  # a failed BigQuery job never stops the weekly fetch
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MODE: ${{ inputs.pypi_bigquery }}
        run: python -m ai_tracker.sources.pypi_bq "$MODE"
      - name: Fetch all series and run the warehouse checks
        id: weekly
        run: |
          set +e
          python -m ai_tracker.pipeline weekly
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 = only stale series (freshness check): the table is sound, save the cache and fail below
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
      # After the cache save and before the stale check, so a table that passed the checks is snapshotted even when
      # the job then fails on freshness. The key is passed only as an env var to the pack step and never echoed.
      - name: Check for DATA_KEY secret
        id: datakey
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ -n "${DATA_KEY}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATA_KEY secret not set: no encrypted data snapshot this run (docs/drift.md, Datasnapshot)."
          fi
      - name: Pack encrypted data snapshot
        if: steps.datakey.outputs.present == 'true'
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python -m ai_tracker.datasnapshot pack --out snapshot-out/data-snapshot.aisnap
      - name: Upload encrypted data snapshot
        if: steps.datakey.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-snapshot
          path: snapshot-out/data-snapshot.aisnap
          retention-days: 14
          compression-level: 0  # already compressed and encrypted
          if-no-files-found: error
      - name: Fail on stale series
        if: always() && steps.weekly.outputs.rc == '2'  # also when a snapshot step failed
        run: |
          echo "::error::Stale series (see the fetch step log and docs/drift.md, section Aktualitet)."
          exit 1
