# Weekly data fetch (Mondays). Refreshes every catalog series into the Actions cache and runs the warehouse checks.
# Nothing is committed and no data artifact is uploaded (artifacts of a public repo are downloadable; licences). Scheduled runs only happen on the default branch (main); run by hand with workflow_dispatch.
# A failed check fails the job before the cache is saved, so a bad table never replaces the cached one.
# A stale series (freshness check, exit 2) saves the cache first and then fails the job.
# Shares the concurrency group and cache key prefix with the other data jobs (nowcast.yml, collect-weekly.yml).
name: Weekly data fetch

on:
  schedule:
    - cron: "37 3 * * 1"  # Mondays 03:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-data  # never two jobs writing the data cache at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # a cold cache refetches every SEC filing (rate limited) and the EIA back issues
    env:
      PYTHONPATH: src
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}  # GitHub commit search (g3_ghs_*, track B2): 30 searches/min with a token
    steps:
      - uses: actions/checkout@v4
      - name: Require SEC_USER_AGENT (no fallback for sec.gov)
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::Repository secret SEC_USER_AGENT is missing. sec.gov requires a declared User-Agent with a contact address, e.g. 'ai-rollout-tracker <contact address>'. See docs/drift.md."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
          restore-keys: ai-data-
      - name: Fetch all series and run the warehouse checks
        id: weekly
        run: |
          set +e
          python -m ai_tracker.pipeline weekly
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 = only stale series (freshness check): the table is sound, save the cache and fail below
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
      - name: Fail on stale series
        if: steps.weekly.outputs.rc == '2'
        run: |
          echo "::error::Stale series (see the fetch step log and docs/drift.md, section Aktualitet)."
          exit 1
