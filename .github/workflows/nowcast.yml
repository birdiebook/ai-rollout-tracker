# Live nowcasts on their registered origin days (UTC), docs/drift.md:
#   N2 (TSMC monthly revenue): day 5 of each month, target = the previous month.
#   N1 (capex, 4 hyperscalers): quarter end + 20 days (20 Jan/Apr/Jul/Oct), target = the quarter just ended.
#   N4 (cloud revenue) and N6 (RPO sum): the same day as N1. N3 (Nvidia data center): fiscal quarter end + 14 days.
#   N5 (BTOS): the day before a publication in the logged BTOS schedule (data/raw/census_btos/schedule_log.parquet).
#   D2 (horizons 1-8, shadow): N1's day from 2027-01-20, forecasts/d2/<quarter>.json (D2's holdout is never run).
# Runs daily; the first step decides whether today is an origin and otherwise the job ends there. Weekend
# origins are kept, never shifted. A missed origin is not made up later.
# On an origin: restore the data cache, refresh the needed series, write forecasts/<nowcast>/<period>.json from
# as_of(today) and commit only that new file plus forecasts/SCORECARD.md to main. An existing forecast file is
# never rewritten or re-committed (the timestamp is the proof). Two daily slots, so a failed first attempt is
# retried the same UTC day; the second finds the committed file and skips.
#
# Permission: contents: write lets the job's own GITHUB_TOKEN push this one commit to this repository only.
name: Live nowcasts

on:
  schedule:
    - cron: "47 18 * * *"  # 18:47 UTC: after the US morning releases, well before the UTC date changes
    - cron: "19 21 * * *"  # retry slot, same UTC day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-data
  cancel-in-progress: false

jobs:
  nowcast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Is today (UTC) a registered origin?
        id: due
        run: python -m ai_tracker.pipeline due
      - name: Require SEC_USER_AGENT (no fallback for sec.gov)
        if: steps.due.outputs.due == 'true'
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::error::Repository secret SEC_USER_AGENT is missing. sec.gov requires a declared User-Agent with a contact address, e.g. 'ai-rollout-tracker <contact address>'. See docs/drift.md."
            exit 1
          fi
      - name: Restore data cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
          restore-keys: ai-data-
      - name: Refresh inputs and write the live forecast
        id: live
        if: steps.due.outputs.due == 'true'
        run: python -m ai_tracker.pipeline live
      - name: Save data cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: ai-data-${{ github.run_id }}
      - name: Commit the new forecast and the scorecard to main
        if: steps.live.outputs.written != ''
        env:
          WRITTEN: ${{ steps.live.outputs.written }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # publish refuses any path already in HEAD and any staged file other than the new forecasts + scorecard
          python -m ai_tracker.pipeline publish ${WRITTEN}
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then echo "nothing committed"; exit 0; fi
          git pull --rebase origin main  # an add/add conflict (file appeared meanwhile) fails here: no overwrite
          git push origin HEAD:main
